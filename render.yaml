services:
  - type: web
    name: portaria-uniarte
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT --forwarded-allow-ips '*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: DATABASE_URL
        fromDatabase:
          name: portaria-uniarte-db
          property: connectionString

databases:
  - name: portaria-uniarte-db
    plan: free
    databaseName: portaria
    user: portaria
